name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp ruff
      - run: ruff check custom_components
      - run: ruff format --check custom_components tests
      - run: python tests/test_cooks.py
      - run: python tests/test_manager_cooks.py
      - run: python tests/test_cook_sync.py
